```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-light">
    <section class="min-vh-100 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                        <div class="card-header bg-success text-white text-center py-4 border-0">
                            <div class="mb-2">
                                <i class="fas fa-user-plus fa-3x"></i>
                            </div>
                            <h2 class="fw-bold mb-1">
                                Create Account
                            </h2>
                            <p class="mb-0">
                                Student Management System
                            </p>
                        </div>
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <h4 class="fw-bold">
                                    Register New Account
                                </h4>
                                <p class="text-muted mb-0">
                                    Fill in the information below
                                </p>
                            </div>
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label for="registerName" class="form-label fw-semibold">
                                        <i class="fas fa-user me-2 text-success"></i>
                                        Full Name
                                    </label>
                                    <input type="text" id="registerName" class="form-control form-control-lg"
                                        placeholder="Enter your full name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="registerEmail" class="form-label fw-semibold">
                                        <i class="fas fa-envelope me-2 text-success"></i>
                                        Email Address
                                    </label>
                                    <input type="email" id="registerEmail" class="form-control form-control-lg"
                                        placeholder="Enter your email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="registerPassword" class="form-label fw-semibold">
                                        <i class="fas fa-lock me-2 text-success"></i>
                                        Password
                                    </label>
                                    <input type="password" id="registerPassword" class="form-control form-control-lg"
                                        placeholder="Create a password" required>
                                </div>
                                <div class="mb-4">
                                    <label for="confirmPassword" class="form-label fw-semibold">
                                        <i class="fas fa-shield-halved me-2 text-success"></i>
                                        Confirm Password
                                    </label>
                                    <input type="password" id="confirmPassword" class="form-control form-control-lg"
                                        placeholder="Confirm your password" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-success btn-lg">
                                        <i class="fas fa-user-plus me-2"></i>
                                        Create Account
                                    </button>
                                </div>
                            </form>
                            <div class="text-center mt-4">
                                <p class="text-muted mb-0">
                                    Already have an account?
                                    <a href="login.html" class="text-success fw-bold text-decoration-none"> Login</a>
                                </p>
                            </div>
                        </div>
                    </div>
                    <p class="text-center text-muted mt-4 small">
                        © 2026 Student Management System
                    </p>
                </div>
            </div>
        </div>
    </section>
    <script src="register.js"></script>
</body>
</html>
```
